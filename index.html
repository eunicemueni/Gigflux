<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GigFlux – Work. Earn. Grow.</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: Arial, sans-serif; background:#0B0E15; color:#fff; }
  .header { background:#0077B5; padding:20px; text-align:center; }
  .header h1 { color:#D4AF37; font-size:2rem; font-weight:bold; }
  .container { max-width:800px; margin:40px auto; padding:20px; background:#071124; border-radius:12px; }
  input, textarea { width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:none; background:#00000050; color:#fff; }
  button { width:100%; padding:12px; margin-bottom:15px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; }
  .btn-paypal { background:#FFC439; color:#000; }
  .btn-paystack { background:#00A551; color:#fff; }
  .btn-bank { background:#0F4BE5; color:#fff; }
</style>
</head>
<body>

<div class="header">
  <h1>GigFlux – Work. Earn. Grow.</h1>
</div>

<div class="container">
  <h2 class="text-center text-xl mb-4">Post a Job</h2>
  <form id="jobForm">
    <input type="text" id="title" placeholder="Job Title" required>
    <textarea id="desc" placeholder="Job Description" rows="4" required></textarea>
    <input type="text" id="type" placeholder="Job Type (e.g., Microtask, Gig, Full Project)" required>
    <input type="number" id="amount" placeholder="Amount to Pay (USD)" required>
    <input type="email" id="clientEmail" placeholder="Your Email" required>
    
    <button type="button" class="btn-paypal" onclick="pay('paypal')">Pay via PayPal</button>
    <button type="button" class="btn-paystack" onclick="pay('paystack')">Pay via Paystack</button>
    <button type="button" class="btn-bank" onclick="pay('bank')">Bank Transfer</button>
  </form>
</div>

<script>
async function pay(method){
  const title = document.getElementById('title').value;
  const desc = document.getElementById('desc').value;
  const type = document.getElementById('type').value;
  const amount = parseFloat(document.getElementById('amount').value);
  const clientEmail = document.getElementById('clientEmail').value;

  if(!title || !desc || !type || !amount || !clientEmail){
    alert('Please fill all fields');
    return;
  }

  // Send job to backend as pending_payment
  const res = await fetch('https://YOUR_BACKEND_URL/api/jobs', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ title, desc, type, amount, clientEmail })
  });
  const data = await res.json();
  if(!data.success) { alert('Error creating job'); return; }

  // Redirect to payment
  if(method==='paypal'){
    window.location.href = 'https://www.paypal.com/ncp/payment/ETVJ9U2YBBZXL';
  } else if(method==='paystack'){
    window.location.href = 'https://paystack.shop/pay/owaky1piaz';
  } else if(method==='bank'){
    alert('Please transfer USD ' + amount + ' to account: 2043681098');
  }
}
</script>

</body>
</html>
